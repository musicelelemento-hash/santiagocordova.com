<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SC PRO - Asistente Claves SRI</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
    }
    .icon { font-size: 20px; }
    .title {
      font-weight: 800;
      font-size: 12px;
      color: #fbbf24;
      text-transform: uppercase;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 6px;
      border: none;
      background: #1e293b;
      color: #94a3b8;
      border-radius: 8px;
      font-weight: 700;
      font-size: 10px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #f59e0b;
      color: #ffffff;
    }
    .card {
      background: #1e293b;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 10px;
    }
    .label {
      font-size: 9px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .value {
      font-family: monospace;
      font-weight: 700;
      font-size: 12px;
      color: #f8fafc;
    }
    .input-field {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #ffffff;
      font-size: 10px;
      font-family: monospace;
      margin-bottom: 8px;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 10px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
    }
    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
    }
    .footer {
      font-size: 9px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <span class="icon">🔑</span>
    <div>
      <div class="title">SC PRO - Asistente SRI Nube</div>
      <div style="font-size: 9px; color: #94a3b8;">SantiagoCordova.com Direct Cloud Sync</div>
    </div>
  </div>

  <div class="tabs">
    <button id="tab-active-btn" class="tab-btn active">📌 Cliente Activo</button>
    <button id="tab-config-btn" class="tab-btn">⚙️ Conexión Nube</button>
  </div>

  <!-- TAB 1: CLIENTE ACTIVO -->
  <div id="tab-active-content" class="tab-content active">
    <div class="card">
      <div class="label">RUC / Cliente Pendiente:</div>
      <div id="popup-ruc" class="value">Cargando...</div>
    </div>

    <div class="card">
      <div class="label">Clave Actual:</div>
      <div id="popup-old-pass" class="value">-</div>
      
      <div class="label" style="margin-top: 8px;">Nueva Clave (* ➔ @):</div>
      <div id="popup-new-pass" class="value" style="color: #fbbf24;">-</div>
    </div>

    <button id="btn-open-sri" class="btn btn-primary">🚀 Abrir Portal SRI</button>
    <button id="btn-copy-new" class="btn btn-secondary">📋 Copiar Nueva Clave</button>
    <button id="btn-sync-cloud-now" class="btn btn-success">🔄 Sincronizar Nube Ahora</button>
  </div>

  <!-- TAB 2: CONFIGURACIÓN SUPABASE -->
  <div id="tab-config-content" class="tab-content">
    <div class="card">
      <div class="label">Supabase URL:</div>
      <input type="text" id="cfg-supabase-url" class="input-field" placeholder="https://xyz.supabase.co" />

      <div class="label">Supabase Anon Key:</div>
      <input type="password" id="cfg-supabase-key" class="input-field" placeholder="eyJhbGci..." />

      <button id="btn-save-supabase" class="btn btn-primary">⚡ Probar & Guardar Conexión Nube</button>
    </div>

    <div id="cfg-status-msg" style="font-size: 10px; font-weight: 700; text-align: center; margin-top: 6px; color: #fbbf24;"></div>
  </div>

  <div class="footer">
    Santiago Córdova - Asistente Fiscal Élite v2.0 (Supabase Direct Sync)
  </div>

  <script src="supabase_bridge.js"></script>
  <script src="popup.js"></script>
</body>
</html>
