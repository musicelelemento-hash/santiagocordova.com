<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRI Asistente Premium</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      --text-main: #1e293b;
      --text-sec: #64748b;
    }

    body {
      width: 360px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-gradient);
      color: var(--text-main);
    }

    .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      padding: 24px 20px;
      color: white;
      text-align: center;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header p {
      margin: 5px 0 0;
      opacity: 0.8;
      font-size: 12px;
    }

    .status-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    .dashboard {
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.15);
      border-color: var(--primary);
    }

    .card-icon {
      font-size: 24px;
      background: #eff6ff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .card.primary {
      grid-column: span 2;
      background: linear-gradient(to right, #ffffff, #f8fafc);
      padding: 20px;
      border-left: 4px solid var(--primary);
    }

    .card.primary .card-icon {
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 28px;
    }

    .footer {
      text-align: center;
      padding: 15px;
      font-size: 11px;
      color: var(--text-sec);
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      margin-top: 10px;
    }

    /* Tweak input file */
    input[type=file] {
      display: none;
    }
    
    .drop-zone {
      margin-top: 10px;
      padding: 20px;
      border: 2px dashed rgba(37,99,235,0.4);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      background: rgba(255,255,255,0.8);
      transition: all 0.3s;
    }
    .drop-zone:hover {
      background: rgba(239,246,255,0.9);
      border-color: var(--primary);
    }
    .drop-text {
      font-size: 13px;
      color: var(--text-main);
      font-weight: 600;
      margin-top: 8px;
    }
    .badge-icon {
      font-size: 28px;
    }
    #status {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      width: 100%;
      text-align: center;
      font-weight: bold;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 6px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      border-radius: 4px;
    }
    .file-item:last-child {
      border-bottom: none;
    }
    .file-remove {
      color: #ef4444; cursor: pointer; font-weight: bold;
    }

    #status.success { background: #dcfce7; color: #166534; display: block; }
    #status.error { background: #fee2e2; color: #991b1b; display: block; }
    #status.processing { background: #dbeafe; color: #1e40af; display: block; }
  </style>
</head>

<body>

  <div class="header">
    <h1>SRI Asistente Premium</h1>
    <p>Suite Profesional para Contadores</p>
    <div class="status-badge">● Sistema Activo</div>
  </div>

  <div class="dashboard" style="display:flex; flex-direction:column;">
    <!-- Drop & Go Zone -->
        <label class="drop-zone" id="drop-zone" for="file-upload">
           <div class="badge-icon">📂</div>
           <div class="drop-text" id="drop-text-label">Suelta aquí tus PDFs (Lote)</div>
           <div style="font-size: 11px; color:#64748b; margin-top:4px;">Arrastra y acumula facturas</div>
        </label>
        <input type="file" id="file-upload" accept="application/pdf" multiple />

        <div id="queue-container" style="display:none; width:100%; margin-top:15px;">
            <div style="font-size: 12px; font-weight: 600; color: var(--primary); display: flex; justify-content: space-between; margin-bottom: 5px;">
                <span>Lista de Lote</span>
                <span id="queue-count" style="background:#dbeafe; color:#1d4ed8; padding: 2px 6px; border-radius: 12px; font-size:10px;">0</span>
            </div>
            <div id="queue-list" style="max-height: 120px; overflow-y: auto; text-align: left; font-size: 11px; background: rgba(0,0,0,0.02); border-radius: 6px; padding: 5px; border: 1px solid rgba(0,0,0,0.05);"></div>
            <button id="btn-process-batch" style="margin-top: 10px; width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: inherit; font-size: 13px; transition: transform 0.1s, opacity 0.2s;">
              🚀 Iniciar Automatización
            </button>
            <button id="btn-clear-queue" style="margin-top: 5px; width: 100%; padding: 8px; background: transparent; color: #ef4444; border: 1px dashed #fca5a5; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: inherit; font-size: 11px; transition: all 0.2s;">
              🗑️ Vaciar Cola
            </button>
        </div>

        <div id="status" class="alert-success"></div>

    <!-- Main Action: Navegar a Anulación -->
    <a href="https://srienlinea.sri.gob.ec/tuportal-internet/accederAplicacion.jspa?redireccion=61&idGrupo=58"
      class="card primary" id="btn-navegar" style="padding: 15px; margin-top: 10px;">
      <span class="card-title" style="font-size: 14px;">Ingresar al Portal sin PDFs</span>
    </a>
  </div>

  <div class="footer">
    <strong>SOLUCIONES TRIBUTARIAS ESTRATÉGICAS</strong><br>
    Ing. Santiago Córdova - Contable<br>
    <span style="font-size: 10px; opacity: 0.8;">WhatsApp: 0978980722</span><br>
    <div style="margin-top: 5px; opacity: 0.6; font-size: 9px;">v3.0 Final Release</div>
  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
