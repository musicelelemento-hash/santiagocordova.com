<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Luz 3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #051424;
            --bg-surface: #0b1c2e;
            --primary: #4edea3;
            --primary-glow: rgba(78, 222, 163, 0.2);
            --amber: #ffb95f;
            --amber-glow: rgba(255, 185, 95, 0.2);
            --rose: #ff8585;
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 440px;
            font-family: 'Manrope', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            height: 590px;
        }

        .header {
            padding: 14px 18px;
            background: rgba(5, 20, 36, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-title {
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            letter-spacing: -0.01em;
        }

        .header-subtitle {
            font-size: 10px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 2px;
        }

        .btn-sync {
            background: rgba(78, 222, 163, 0.1);
            border: 1px solid rgba(78, 222, 163, 0.3);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s;
        }

        .btn-sync:hover {
            background: rgba(78, 222, 163, 0.2);
            box-shadow: 0 0 12px var(--primary-glow);
            transform: translateY(-1px);
        }

        .auto-bar {
            padding: 8px 18px;
            background: rgba(78, 222, 163, 0.05);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls {
            padding: 12px 18px 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        select, input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-highlight);
            color: white;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 11px;
            outline: none;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        select option {
            background: #051424;
            color: white;
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding-left: 28px;
            font-family: 'Manrope', sans-serif;
            font-size: 11px;
        }

        .search-icon {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            opacity: 0.6;
        }

        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            background: transparent;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: rgba(78, 222, 163, 0.08);
            font-weight: 800;
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 12px 18px 18px;
            flex-direction: column;
            gap: 10px;
        }

        .tab-content.active {
            display: flex;
        }

        .tab-content::-webkit-scrollbar {
            width: 5px;
        }
        .tab-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .client-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s;
            backdrop-filter: blur(10px);
        }

        .client-card:hover {
            background: rgba(78, 222, 163, 0.03);
            border-color: rgba(78, 222, 163, 0.3);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .client-info {
            flex: 1;
            min-width: 0;
            padding-right: 10px;
        }

        .client-name {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
            color: #f8fafc;
        }

        .client-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .due-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 185, 95, 0.12);
            border: 1px solid rgba(255, 185, 95, 0.3);
            color: var(--amber);
            font-weight: 700;
        }

        .client-password {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .client-password:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-start {
            background: linear-gradient(135deg, #4edea3 0%, #10b981 100%);
            border: none;
            color: #003824;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        .btn-start:hover {
            transform: translateY(-1px) scale(1.02);
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 18px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e293b;
            transition: .3s;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        .toggle-switch input:checked + .toggle-slider {
            background-color: var(--primary);
        }
        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(18px);
            background-color: #003824;
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            gap: 12px;
            margin-top: 40px;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="header-title">💎 Nueva Luz 3.0</div>
            <div class="header-subtitle">SRI ENGINE • COCKPIT</div>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
            <button id="btnImportarCsv" class="btn-sync" style="background:rgba(99,102,241,0.15); border-color:rgba(99,102,241,0.3); color:#a5b4fc;" title="Cargar contraseñas masivamente desde CSV de Chrome o formato RUC,Clave">
                📥 Claves CSV
            </button>
            <button id="btnSyncCloud" class="btn-sync" title="Sincronizar datos con la nube de Supabase">
                🔄 Nube
            </button>
        </div>
    </div>
    <input type="file" id="inputCsvClaves" accept=".csv,.txt" style="display:none">

    <div class="auto-bar">
        <div style="display: flex; flex-direction: column;">
            <span style="font-size: 11px; font-weight: 800; color: #f8fafc; display: flex; align-items: center; gap: 4px;">
                ⚡ Modo Auto (Bucle Continuo)
            </span>
            <span style="font-size: 10px; color: var(--text-dim);">Declara y avanza al siguiente cliente</span>
        </div>
        <label class="toggle-switch">
            <input type="checkbox" id="chkAutoBatch">
            <span class="toggle-slider"></span>
        </label>
    </div>

    <div class="controls">
        <select id="periodMonth">
            <option value="0">Enero</option>
            <option value="1">Febrero</option>
            <option value="2">Marzo</option>
            <option value="3">Abril</option>
            <option value="4">Mayo</option>
            <option value="5">Junio</option>
            <option value="6">Julio</option>
            <option value="7">Agosto</option>
            <option value="8">Septiembre</option>
            <option value="9">Octubre</option>
            <option value="10">Noviembre</option>
            <option value="11">Diciembre</option>
        </select>
        <select id="periodYear"></select>

        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar RUC o Nombre...">
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-target="pendientesList">Pendientes (<span id="countPendientes">0</span>)</button>
        <button class="tab-btn" data-target="completadosList">Completados (<span id="countCompletados">0</span>)</button>
        <button class="tab-btn" data-target="erroresList">⚠️ Error (<span id="countErrores">0</span>)</button>
        <button class="tab-btn" data-target="otrosList">📋 Otros (<span id="countOtros">0</span>)</button>
    </div>

    <div id="pendientesList" class="tab-content active">
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <div>Cargando clientes...</div>
        </div>
    </div>

    <div id="completadosList" class="tab-content"></div>
    <div id="erroresList" class="tab-content"></div>
    <div id="otrosList" class="tab-content"></div>

    <div style="padding: 8px 18px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; gap: 8px;">
        <span style="font-size: 9px; color: var(--text-dim); line-height: 1.4;">💡 Selecciona el <b>periodo</b> y pulsa <b>▶ Ingresar</b> en un cliente (o activa <b>⚡ Modo Auto</b> para encadenar).</span>
        <span id="popupFootVersion" style="font-size: 9px; color: #475569; font-family: 'JetBrains Mono', monospace; white-space: nowrap;">v3.1.0</span>
    </div>

    <!-- Las claves viven en la página de Ajustes, no acá: es una pantalla
         entera, se abre en su propia pestaña y es donde cualquiera las busca. -->
    <div style="padding: 0 18px 12px;">
        <button id="btnAjustes" style="width:100%; background:rgba(148,163,184,0.12); border:1px solid var(--border); color:var(--text-dim); padding:7px; border-radius:8px; font-size:10px; font-weight:700; cursor:pointer;">
            ⚙️ Ajustes y claves
        </button>
    </div>

    <script src="shared_config.js"></script>
    <script src="popup.js"></script>
</body>
</html>
