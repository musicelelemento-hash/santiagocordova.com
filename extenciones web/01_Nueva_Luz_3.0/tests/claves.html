<!doctype html><meta charset="utf-8"><title>Ajustes: las claves, fuera del código</title>
<body style="font:12px ui-monospace,monospace;padding:18px;background:#0b1622;color:#d5e4fa">
<h3>Una clave en <code>shared_config.js</code> es una clave publicada</h3>
<pre id="out">…</pre>
<div id="popup"></div>
<script>
  // El popup real, con su propio mock: se prueba el markup y el código que
  // están en producción, no una copia.
  const store = {};
  window.__errors = [];
  window.onerror = (m, s, l, c, e) => window.__errors.push(String((e && e.stack) || m));
  window.addEventListener('unhandledrejection',
    e => window.__errors.push('RECHAZO: ' + ((e.reason && e.reason.message) || e.reason)));
  window.chrome = {
    runtime: { getURL: p => p, onMessage: { addListener() {} }, sendMessage: () => Promise.resolve({}), id: 't' },
    storage: {
      local: {
        get: k => Promise.resolve(
          k === null ? { ...store }
          : Array.isArray(k) ? Object.fromEntries(k.filter(x => x in store).map(x => [x, store[x]]))
          : (typeof k === 'string' ? (k in store ? { [k]: store[k] } : {}) : {})),
        set: o => { Object.assign(store, o); return Promise.resolve(); },
        remove: k => { [].concat(k).forEach(x => delete store[x]); return Promise.resolve(); }
      },
      onChanged: { addListener() {} }
    },
    tabs: { create() {}, query: () => Promise.resolve([]) }
  };
</script>
<script>
(async () => {
  const L = [], ok = [];
  const push = (k, v, e) => { const b = JSON.stringify(v) === JSON.stringify(e); ok.push(b);
    L.push((b ? '  ' : '✗ ') + String(k).padEnd(58) + JSON.stringify(v) + (b ? '' : '  ESPERADO: ' + JSON.stringify(e))); };
  const sec = (t) => L.push('\n── ' + t + ' ' + '─'.repeat(Math.max(0, 70 - t.length)));
  const pintar = () => {
    const fallos = ok.filter(x => !x).length;
    document.getElementById('out').textContent = L.join('\n') + '\n\n' +
      (fallos ? '✗ ' + fallos + ' de ' + ok.length + ' fallaron'
              : '✓ ' + ok.length + ' comprobaciones, todas bien') +
      (window.__errors.length ? '\n\nERRORES SUELTOS:\n' + window.__errors.join('\n') : '');
  };

  // ── El markup de verdad, sacado de la página que se distribuye ──────────
  // Con `?v=` para saltear la caché del navegador. Sin esto el banco monta la
  // versión que quedó guardada de una corrida anterior y comprueba markup que
  // ya no existe — que es peor que no comprobar nada, porque sale en verde.
  const html = await (await fetch('../options.html?v=' + Date.now())).text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const panel = doc.querySelector('.hoja');

  sec('A · la página de Ajustes, tal como se distribuye');
  push('tiene los dos campos',
       [!!doc.getElementById('claveIa'), !!doc.getElementById('claveR2')], [true, true]);
  push('la clave de IA no se ve al teclear',
       doc.getElementById('claveIa').type, 'password');
  push('la de R2 tampoco',
       doc.getElementById('claveR2').type, 'password');
  push('ni las autocompleta el navegador',
       doc.getElementById('claveIa').getAttribute('autocomplete'), 'off');
  push('ni el corrector se mete',
       doc.getElementById('claveIa').getAttribute('spellcheck'), 'false');
  push('guardar y borrar son botones distintos',
       [!!doc.getElementById('btnGuardarClaves'), !!doc.getElementById('btnBorrarClaves')], [true, true]);
  push('y el popup tiene por dónde llegar',
       (await (await fetch('../popup.html')).text()).includes('btnAjustes'), true);
  push('el manifest la declara como página de opciones',
       !!(await (await fetch('../manifest.json')).json()).options_ui, true);

  // ── B · el código real, corriendo sobre ese markup ──────────────────────
  document.getElementById('popup').append(panel.cloneNode(true));
  // El aviso flotante vive fuera de .hoja: se trae también, porque forma
  // parte de la página real.
  const flotante = doc.getElementById('aviso-flotante');
  if (flotante) document.body.appendChild(flotante.cloneNode(true));

  // options.js engancha todo en DOMContentLoaded, que acá ya pasó: se dispara
  // a mano después de cargarlo, sobre el markup real recién insertado.
  await new Promise((r) => {
    const sc = document.createElement('script');
    sc.src = '../options.js?v=' + Date.now();   // ídem: nada de caché
    sc.onload = r; sc.onerror = r;
    document.body.appendChild(sc);
  });
  window.__errors.length = 0;
  document.dispatchEvent(new Event('DOMContentLoaded'));
  await new Promise(r => setTimeout(r, 60));

  sec('B · guardar');
  const SECRETO = 'AIza-de-mentira-1234-FINAL';
  document.getElementById('claveIa').value = SECRETO;
  document.getElementById('btnGuardarClaves').click();
  await new Promise(r => setTimeout(r, 60));

  push('la clave queda en el almacén local',
       (store.sc_ia_credenciales || {}).apiKey, SECRETO);
  push('y el campo se vacía al guardar',
       document.getElementById('claveIa').value, '');

  sec('C · lo que se muestra no es la clave');
  const estado = document.getElementById('estadoIa').textContent;
  push('el estado NO contiene la clave',    estado.includes(SECRETO), false);
  push('pero dice que hay una guardada',    /guardada/.test(estado), true);
  push('y cómo termina, para reconocerla',  estado.includes('FINAL'), true);
  // Seis caracteres alcanzan para saber cuál está puesta y no alcanzan para
  // nada más. La clave entera nunca sale de chrome.storage.local.
  push('pero no muestra más que la cola',   estado.includes('mentira'), false);
  push('el markup tampoco la deja escrita',
       document.getElementById('popup').innerHTML.includes(SECRETO), false);

  sec('D · un campo vacío no borra nada');
  document.getElementById('claveIa').value = '';
  document.getElementById('claveR2').value = 'r2-de-mentira';
  document.getElementById('btnGuardarClaves').click();
  await new Promise(r => setTimeout(r, 60));
  push('la de IA sigue donde estaba',
       (store.sc_ia_credenciales || {}).apiKey, SECRETO);
  push('y la de R2 se guardó aparte',
       (store.sc_r2_credenciales || {}).R2_SECRET_ACCESS_KEY, 'r2-de-mentira');

  sec('E · borrar UNA no se lleva las demás');
  // El usuario, 07-sep-2026, cuando le dije que borrara la llave de Supabase:
  // «¿borrar todas?». Tenía razón en preguntar: el único botón era «Borrar
  // todas» y se llevaba puestas las de R2, que son las que hacen funcionar la
  // subida. Arreglar una cosa rompiendo otra no es arreglar — y no puede
  // depender de que alguien pregunte antes de apretar.
  store.sc_ia_credenciales  = { apiKey: 'ia-que-se-queda' };
  store.sc_web_placeholder  = 1;   // testigo: nada más debe tocarse
  store.sc_supabase_credenciales = { SUPABASE_ANON_KEY: 'web-que-se-va' };
  store.sc_r2_credenciales  = { R2_ACCESS_KEY_ID: 'id-que-se-queda',
                                R2_SECRET_ACCESS_KEY: 'secreto-que-se-queda' };

  document.querySelector('[data-borra="web"]').click();
  await new Promise(r => setTimeout(r, 60));
  push('se fue la de Supabase',        'sc_supabase_credenciales' in store, false);
  push('la de IA sigue',               (store.sc_ia_credenciales || {}).apiKey, 'ia-que-se-queda');
  push('el Access Key ID de R2 sigue', (store.sc_r2_credenciales || {}).R2_ACCESS_KEY_ID, 'id-que-se-queda');
  push('y la clave secreta también',   (store.sc_r2_credenciales || {}).R2_SECRET_ACCESS_KEY, 'secreto-que-se-queda');

  // Las dos de R2 comparten una sola llave del almacén: sacar una tiene que
  // conservar la otra. Rotar el secreto sin perder el ID es lo normal.
  document.querySelector('[data-borra="r2"]').click();
  await new Promise(r => setTimeout(r, 60));
  push('se fue sólo la clave secreta', (store.sc_r2_credenciales || {}).R2_SECRET_ACCESS_KEY, undefined);
  push('y el ID quedó',                (store.sc_r2_credenciales || {}).R2_ACCESS_KEY_ID, 'id-que-se-queda');

  // Y cuando se saca lo último de R2, la llave entera se va: no queda un
  // objeto vacío que después parezca «hay algo guardado».
  document.querySelector('[data-borra="idR2"]').click();
  await new Promise(r => setTimeout(r, 60));
  push('sin nada de R2, no queda cáscara', 'sc_r2_credenciales' in store, false);
  push('y lo ajeno nunca se tocó',         store.sc_web_placeholder, 1);

  sec('F · borrar TODAS sigue borrando todas');
  document.getElementById('btnBorrarClaves').click();
  await new Promise(r => setTimeout(r, 60));
  push('no queda la de IA',  'sc_ia_credenciales' in store, false);
  push('ni la de R2',        'sc_r2_credenciales' in store, false);
  push('y el estado lo dice',
       /no hay ninguna/.test(document.getElementById('estadoIa').textContent), true);

  pintar();
})();
</script>
