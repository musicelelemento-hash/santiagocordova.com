<!doctype html><meta charset="utf-8"><title>Tarifas de IVA: cociente y XML</title>
<body style="font:12px ui-monospace,monospace;padding:18px;background:#0b1622;color:#d5e4fa">
<h3>Las compras al 5% van al 540/550, no al 500 junto con el 15%</h3>
<pre id="out">…</pre>
<div id="portal"></div>
<script>
  const store={};
  window.__errors=[]; window.__logs=[];
  const cap=(f)=>(...a)=>{window.__logs.push(a.map(String).join(' '));f(...a);};
  console.log=cap(console.log); console.warn=cap(console.warn); console.error=cap(console.error);
  window.onerror=(m,s,l,c,e)=>window.__errors.push(String(e&&e.stack||m));
  window.addEventListener('unhandledrejection',e=>window.__errors.push('RECHAZO: '+(e.reason&&e.reason.message||e.reason)));
  window.chrome={runtime:{getURL:p=>p,onMessage:{addListener(){}},sendMessage:()=>Promise.resolve({ok:false}),id:'s'},
   storage:{local:{get:k=>Promise.resolve(k===null?{...store}:(Array.isArray(k)?Object.fromEntries(k.filter(x=>x in store).map(x=>[x,store[x]])):(typeof k==='string'?(k in store?{[k]:store[k]}:{}):{}))),set:(o,cb)=>{Object.assign(store,o);cb&&cb();return Promise.resolve()},remove:k=>{[].concat(k).forEach(x=>delete store[x]);return Promise.resolve()}},onChanged:{addListener(){}}},tabs:{create(){}}};
</script>
<script src="../shared_config.js"></script>
<script src="../build/content.js"></script>
<script>
(async()=>{
  const L=[],ok=[];
  const push=(k,v,e)=>{const b=JSON.stringify(v)===JSON.stringify(e);ok.push(b);
    L.push((b?'  ':'✗ ')+String(k).padEnd(64)+JSON.stringify(v)+(b?'':'  ESPERADO: '+JSON.stringify(e)));};
  const sec=(t)=>L.push('\n── '+t+' '+'─'.repeat(Math.max(0,70-t.length)));

  // Una factura tal como la deja extraerFacturasPaginaActual
  const F=(sin,iva,ruc)=>({numero:1,rucRazon:ruc||'099 PROVEEDOR',
    valorSinImpuestos:sin,iva:iva,importeTotal:+(sin+iva).toFixed(2),tieneIva:iva>0});

  // ══ A · clasificarTarifaIva: qué dice y qué NO dice el cociente ══════════
  sec('A · el cociente IVA / base');
  const T=(b,i)=>clasificarTarifaIva(b,i).tarifa;

  push('base 100 con IVA 15 es 15%',            T(100,15),   15);
  push('base 100 con IVA 5 es 5%',              T(100,5),     5);
  push('base 100 sin IVA es 0%',                T(100,0),     0);
  push('base 100 con IVA 12 es 12% (histórico)',T(100,12),   12);
  push('base 100 con IVA 13 es 13% (marzo 2024)',T(100,13),  13);

  // El 8% de feriados queda fuera a propósito: cae en la misma zona que una
  // factura mezclada, y adivinar ahí es peor que decir «no sé».
  push('base 100 con IVA 8 NO se adivina',      T(100,8),  null);

  // ESTE es el caso que hacía falta separar: una factura mezclada (un tercio
  // al 15%, el resto al 0%) da un cociente parecido al del 5%.
  push('base 100 con IVA 7.50 (mezclada) no se adivina', T(100,7.5), null);

  // Redondeo por línea: el portal redondea cada línea, así que una factura
  // grande se aparta unos centavos del producto exacto.
  push('base 1234.56 con IVA 185.18 sigue siendo 15%', T(1234.56,185.18), 15);
  push('base 3.00 con IVA 0.45 es 15% aunque sea chica', T(3,0.45), 15);
  push('base 3.00 con IVA 0.15 es 5% aunque sea chica',  T(3,0.15),  5);

  // Colas binarias de la reconciliación: medio centavo no es IVA.
  push('una cola de 0.004 no convierte una exenta en gravada', T(100,0.004), 0);
  push('sin base no se inventa tarifa', T(0,0), null);

  // ══ B · calcularResumen: dónde termina la plata ══════════════════════════
  sec('B · el reparto de las facturas');
  let r = calcularResumen([F(100,15), F(200,10), F(300,0)]);

  push('la del 5% NO va al balde de tarifa plena', r.iva15.baseImponible, 100);
  push('la del 5% va a su propio balde',           r.iva5.baseImponible,  200);
  push('la exenta al de 0%',                        r.iva0.baseImponible, 300);
  push('y las cuentas cierran: 100+200+300',
       r.iva15.baseImponible+r.iva5.baseImponible+r.iva0.baseImponible, 600);
  push('nada quedó marcado como dudoso',            r.ambiguas.length,      0);

  // ══ C · LA REGRESIÓN: antes esto se declaraba como 15% ═══════════════════
  sec('C · el agujero que se está tapando');
  r = calcularResumen([F(1000,50)]);
  push('$1000 al 5% NO caen en el 500 (base 15%)', r.iva15.baseImponible, 0);
  push('caen en el 540 (base 5%)',                  r.iva5.baseImponible, 1000);
  // El SRI calcula el 520 desde el 510. Declarar 5% como 15% le daba al
  // contribuyente $150 de crédito donde le correspondían $50.
  push('crédito que habría inflado: 15% de 1000',
       +(r.iva15.baseImponible*0.15).toFixed(2), 0);

  // ══ D · las mezcladas: aritmética, no adivinanza ════════════════════════
  // Números REALES de la corrida del 06-sep-2026. Son tickets de Supermaxi y
  // Fybeca: parte al 15%, parte al 0%. De 42 facturas, 15 eran así — en el
  // comercio minorista la mezclada NO es la excepción, es la regla.
  sec('D · las facturas de tarifas mezcladas');

  // base 61.00 con IVA 1.83 → 12.20 al 15% y 48.80 al 0%. Y 12.20 × 0.15 = 1.83.
  let m = repartirMezclada(61, 1.83);
  push('reparte el ticket de Supermaxi', [m.basePlena, m.base0], [12.2, 48.8]);
  push('y el IVA cuadra con la parte gravada',
       Math.abs(m.basePlena * 0.15 - 1.83) < 0.005, true);
  push('las dos partes suman la factura entera',
       redondear(m.basePlena + m.base0), 61);

  // Otro real: base 84.99 con IVA 3.94.
  m = repartirMezclada(84.99, 3.94);
  push('otro ticket real se reparte igual',
       redondear(m.basePlena + m.base0), 84.99);

  // Y el de la farmacia, con casi todo al 0%: base 28.10 con IVA 0.05.
  m = repartirMezclada(28.10, 0.05);
  push('uno con casi todo exento también',  [m.basePlena, m.base0], [0.33, 27.77]);

  // El límite: si la parte gravada NO cabe en la factura, hay una tercera
  // tarifa de por medio y eso sí lo mira el contador.
  push('un IVA mayor que el 15% del total no se reparte',
       repartirMezclada(100, 20), null);
  push('ni una factura sin base',           repartirMezclada(0, 5), null);

  // En el resumen, la mezclada se declara en sus DOS casilleros.
  r = calcularResumen([F(61, 1.83)]);
  push('la parte gravada va al 500/510',    r.iva15.baseImponible, 12.2);
  push('y la exenta al 507/517',            r.iva0.baseImponible, 48.8);
  push('no queda como dudosa',              r.ambiguas.length, 0);
  push('pero sí queda anotada como mezclada', r.mezcladas.length, 1);
  // ANTES esto tiraba los $61 enteros al 15%, inflando el crédito tributario.
  push('el IVA declarado es el que se pagó',  r.iva15.montoIva, 1.83);

  // Lo que de verdad no se puede repartir sigue frenando.
  r = calcularResumen([F(100, 20)]);
  push('lo irrepartible sigue siendo dudoso', r.ambiguas.length, 1);
  push('y su plata no se pierde del total',   r.iva15.baseImponible, 100);

  // ══ E · notas de crédito ════════════════════════════════════════════════
  sec('E · notas de crédito');
  // Con modal (el SRI da el codigoPorcentaje: es la tarifa exacta, no deducida)
  let nc = calcularResumenNotasCredito([{iva0:0,iva5:200,iva15:0,iva:10,
       valorSinImpuestos:200,importeTotal:210}]);
  push('la NC al 5% resta del 550, no del 510',
       [nc.iva5.baseImponible, nc.iva15.baseImponible], [200,0]);

  // Sin modal hay que deducir, igual que en las facturas
  nc = calcularResumenNotasCredito([
       {valorSinImpuestos:200,iva:10,importeTotal:210,comprobanteNo:'001-001-1'},
       {valorSinImpuestos:100,iva:15,importeTotal:115,comprobanteNo:'001-001-2'}]);
  push('sin modal, la del 5% también va a su balde', nc.iva5.baseImponible, 200);
  push('y la del 15% al suyo',                        nc.iva15.baseImponible, 100);

  // ══ F · el freno: no se envía con plata sin casillero ═══════════════════
  sec('F · el freno del cierre mágico');
  push('sin motivos no frena nada',
       await frenarSiHayIvaSinUbicar('prueba'), false);

  await anotarIvaSinUbicar(['no se encontró el casillero 540: $1000.00 sin declarar'], []);
  push('anotado un problema, el cierre frena',
       await frenarSiHayIvaSinUbicar('prueba'), true);

  // Una corrida limpia tiene que poder borrar el freno de la anterior.
  await anotarIvaSinUbicar([], []);
  push('una corrida limpia lo levanta',
       await frenarSiHayIvaSinUbicar('prueba'), false);

  // Las dudosas del resumen también frenan, aunque no falte ningún casillero.
  // 400/30 ya no es dudosa: se reparte. La que frena es la que NO se puede
  // repartir — un IVA mayor que el 15%% del total.
  await anotarIvaSinUbicar([], calcularResumen([F(100,20)]).ambiguas);
  push('una factura dudosa alcanza para frenar',
       await frenarSiHayIvaSinUbicar('prueba'), true);
  await anotarIvaSinUbicar([], []);

  // ══ G · el XML: la tarifa dicha, no deducida ════════════════════════════
  sec('G · el XML autorizado del SRI');

  const XML = (bloques, codDoc) => `<?xml version="1.0" encoding="UTF-8"?>
<factura id="comprobante" version="1.1.0">
  <infoTributaria>
    <razonSocial>TECNOLOGIAS ECUADOR S.A.</razonSocial>
    <ruc>1792183578001</ruc>
    <codDoc>${codDoc||'01'}</codDoc>
    <claveAcceso>1509202601179218357800110010010000154201234567818</claveAcceso>
  </infoTributaria>
  <infoFactura>
    <fechaEmision>15/09/2026</fechaEmision>
    <totalSinImpuestos>${bloques.reduce((a,b)=>a+b[1],0).toFixed(2)}</totalSinImpuestos>
    <totalConImpuestos>
      ${bloques.map(([cp,base,val])=>`<totalImpuesto>
        <codigo>2</codigo><codigoPorcentaje>${cp}</codigoPorcentaje>
        <baseImponible>${base.toFixed(2)}</baseImponible><valor>${val.toFixed(2)}</valor>
      </totalImpuesto>`).join('')}
    </totalConImpuestos>
    <importeTotal>${bloques.reduce((a,b)=>a+b[1]+b[2],0).toFixed(2)}</importeTotal>
  </infoFactura>
</factura>`;

  // El ejemplo del informe: $1000 al 15% y $200 al 0% en la misma factura.
  let x = parsearXmlComprobante(XML([['4',1000,150],['0',200,0]]));
  push('lee la base del 15%',        x.porTarifa['15'], {base:1000, iva:150});
  push('y la del 0% por separado',   x.porTarifa['0'],  {base:200, iva:0});
  push('con el RUC del emisor',      x.rucEmisor, '1792183578001');
  push('y no la toma por nota de crédito', x.esNotaCredito, false);

  // codDoc 04 = nota de crédito: hay que restar, no sumar.
  push('codDoc 04 es nota de crédito',
       parsearXmlComprobante(XML([['4',100,15]],'04')).esNotaCredito, true);

  // El 5% viene dicho por el emisor, no deducido.
  x = parsearXmlComprobante(XML([['5',500,25]]));
  push('el codigoPorcentaje 5 es tarifa 5%', x.porTarifa['5'], {base:500, iva:25});

  // ── EL CASO QUE JUSTIFICA TODO ESTO ────────────────────────────────────
  // $100 con un tercio al 15% y el resto al 0%: el cociente da 4,95% y no se
  // puede distinguir de una factura del 5%. El XML lo dice exacto.
  const mezclada = XML([['4',33,4.95],['0',67,0]]);
  // Y acá está la trampa, medida y no supuesta: el cociente la lee como 5%.
  // No es un bug que haya que "arreglar" — rechazar todo lo que caiga en 5%
  // frenaría cada lote con compras legítimas al 5%. Es el límite del método, y
  // la razón por la que hace falta el XML.
  push('el cociente la confunde con una del 5%',
       clasificarTarifaIva(100, 4.95).tarifa, 5);
  x = parsearXmlComprobante(mezclada);
  push('el XML sí: $33 al 15%',   x.porTarifa['15'], {base:33, iva:4.95});
  push('y $67 al 0%',             x.porTarifa['0'],  {base:67, iva:0});

  // Y repartido en el resumen cae donde corresponde, sin quedar dudosa.
  const vacio = {iva0:{cantidad:0,total:0,baseImponible:0,montoIva:0},
                 iva5:{cantidad:0,total:0,baseImponible:0,montoIva:0},
                 iva15:{cantidad:0,total:0,baseImponible:0,montoIva:0}};
  push('se reparte en los baldes sin ambigüedad', repartirXmlEnResumen(vacio, x), true);
  push('la parte gravada al balde de tarifa plena', vacio.iva15.baseImponible, 33);
  push('y la exenta al de 0%',                      vacio.iva0.baseImponible, 67);

  // La respuesta de autorización trae el comprobante envuelto en un CDATA.
  const envuelto = '<autorizacion><estado>AUTORIZADO</estado><comprobante><![CDATA[' +
                   XML([['4',100,15]]) + ']]></comprobante></autorizacion>';
  push('desenvuelve el CDATA de la autorización',
       parsearXmlComprobante(envuelto).porTarifa['15'], {base:100, iva:15});

  // Un código nuevo no se reparte a ojo.
  x = parsearXmlComprobante(XML([['4',100,15],['99',50,4]]));
  push('un codigoPorcentaje desconocido se anota', x.tarifasDesconocidas, ['99']);
  push('y su plata NO se mete en ningún balde',    x.porTarifa['15'], {base:100, iva:15});
  push('repartirlo avisa que quedó algo afuera',
       repartirXmlEnResumen({iva0:{baseImponible:0,total:0},iva5:{baseImponible:0,total:0},
                             iva15:{baseImponible:0,total:0}}, x), false);

  // El ICE (código 3) no es IVA y no debe contaminar las bases.
  x = parsearXmlComprobante(XML([['4',100,15]]).replace('<codigo>2</codigo>','<codigo>3</codigo>'));
  push('el ICE no entra como IVA', Object.keys(x.porTarifa).length, 0);

  push('un texto que no es XML no revienta', parsearXmlComprobante('hola'), null);
  push('ni una cadena vacía',                parsearXmlComprobante(''),     null);

  // ══ H · la descarga del XML: que el POST salga bien armado ══════════════
  sec('H · el POST que baja el XML de una fila');

  // El portal de recibidos, con lo mínimo que mira descargarXmlComprobante().
  document.getElementById('portal').innerHTML = `
    <input type="hidden" name="javax.faces.ViewState" value="VS-123">
    <select id="frmPrincipal:ano"><option selected value="2026">2026</option></select>
    <select id="frmPrincipal:mes"><option selected value="8">8</option></select>
    <select id="frmPrincipal:dia"><option selected value="0">0</option></select>
    <select id="frmPrincipal:cmbTipoComprobante"><option selected value="1">Factura</option></select>
    <table><tbody>
      <tr><td><a id="frmPrincipal:tablaCompRecibidos:0:lnkXml" href="#">xml</a></td></tr>
      <tr><td><a id="frmPrincipal:tablaCompRecibidos:1:lnkXml" href="#">xml</a></td></tr>
    </tbody></table>`;

  let ultimo = null;
  const fetchReal = window.fetch;
  const responder = (cuerpo, ok2 = true) => {
    window.fetch = async (url, op) => {
      ultimo = { url, op, params: new URLSearchParams(op.body) };
      return { ok: ok2, status: ok2 ? 200 : 500, text: async () => cuerpo };
    };
  };

  responder(XML([['4',100,15]]));
  let res = await descargarXmlComprobante(0);
  push('devuelve el comprobante parseado', res.porTarifa['15'], {base:100, iva:15});
  push('manda el id del enlace como parámetro',
       ultimo.params.get('frmPrincipal:tablaCompRecibidos:0:lnkXml'),
       'frmPrincipal:tablaCompRecibidos:0:lnkXml');
  push('con el ViewState de la página',   ultimo.params.get('javax.faces.ViewState'), 'VS-123');
  push('y el período que está en pantalla',
       [ultimo.params.get('frmPrincipal:ano'), ultimo.params.get('frmPrincipal:mes')], ['2026','8']);
  push('lleva la sesión del portal',      ultimo.op.credentials, 'include');
  // Lo que importa no es que la URL esté limpia —el POST va a la página donde
  // ya estamos, con la query que el portal le puso— sino que NOSOTROS no
  // agreguemos datos ahí: en la URL quedan los logs del servidor.
  push('la petición va a la página donde estamos',
       ultimo.url.startsWith(location.href.split('#')[0].split('?')[0]), true);
  push('y no le agregamos el índice de la fila',
       /lnkXml|tablaComp/.test(ultimo.url), false);

  // La fila 1 tiene su propio índice: no se puede pedir siempre la 0.
  await descargarXmlComprobante(1);
  push('cada fila pide su propio índice',
       ultimo.params.has('frmPrincipal:tablaCompRecibidos:1:lnkXml'), true);

  // Una fila que no está en pantalla no se inventa.
  push('una fila inexistente devuelve null', await descargarXmlComprobante(99), null);

  // Sesión caducada: el portal devuelve HTML, no el comprobante.
  responder('<html><body>Su sesión ha expirado</body></html>');
  push('el HTML de sesión caducada no se toma por comprobante',
       await descargarXmlComprobante(0), null);

  responder('', false);
  push('un HTTP 500 tampoco',  await descargarXmlComprobante(0), null);

  // Varias filas: se piden todas, sin pausa larga en la prueba.
  responder(XML([['5',200,10]]));
  const varios = await traerXmlDeComprobantes([0, 1], { pausaMs: 0 });
  push('baja las dos filas pedidas',        varios.size, 2);
  push('y cada una viene parseada',         varios.get(1).porTarifa['5'], {base:200, iva:10});

  // El tope existe para no dispararle una ráfaga al WAF.
  push('nunca pide más que el tope',
       (await traerXmlDeComprobantes([0,1,0,1,0], { pausaMs: 0, tope: 2 })).size, 2);

  window.fetch = fetchReal;

  // ══ I · leer los casilleros del formulario ══════════════════════════════
  sec('I · el mapa de casilleros');

  // La forma de la tabla del SRI: el número del casillero en una celda, el
  // rótulo en otra, y el input en la siguiente.
  const CAS = (num, rotulo, id, extra) =>
    `<tr><td>${num}</td><td>${rotulo}</td>` +
    `<td><input type="text" id="${id}" value="0.00" ${extra||''}></td></tr>`;

  document.getElementById('portal').innerHTML = `<table><tbody>
    ${CAS('500','Adquisiciones y pagos (excluye activos fijos) gravados tarifa diferente de cero','concepto1270')}
    ${CAS('510','Adquisiciones netas tarifa diferente de cero','concepto1280')}
    ${CAS('507','Adquisiciones y pagos gravados tarifa 0%','concepto1720')}
    ${CAS('520','Impuesto generado en adquisiciones','concepto1290','readonly')}
    <tr><td>Total</td><td>no es un casillero</td><td><input type="text" id="basura"></td></tr>
  </tbody></table>`;

  let mapa = sriMapaCasilleros();
  push('encuentra los cuatro casilleros',    mapa.length, 4);
  push('los ordena por número',              mapa.map(f=>f.casillero), ['500','507','510','520']);
  push('con el id real de cada uno',         mapa[0].id, 'concepto1270');
  push('y su rótulo',  /excluye activos fijos/.test(mapa[0].rotulo), true);
  push('distingue lo editable de lo que no',
       [mapa[0].editable, mapa.find(f=>f.casillero==='520').editable], [true, false]);
  push('la fila sin número de casillero no entra',
       mapa.some(f=>f.id==='basura'), false);

  // ── EL CASO QUE FALLÓ EN PANTALLA ──────────────────────────────────────
  // El portal anida una tabla por celda, así que closest('tr') del input
  // devuelve la fila interna, que no tiene el número. Antes: «no hay
  // casilleros». Ahora lo encuentra yendo desde el rótulo hacia el input.
  document.getElementById('portal').innerHTML = `<table><tbody>
    <tr>
      <td><span>540</span></td>
      <td>Adquisiciones locales gravadas con tarifa 5%</td>
      <td><table><tbody><tr><td><input type="text" id="conceptoAnidado" value="0.00"></td></tr></tbody></table></td>
    </tr>
  </tbody></table>`;
  let anidado = sriMapaCasilleros();
  push('encuentra el input dentro de una tabla anidada',
       (anidado.find(f=>f.casillero==='540')||{}).id, 'conceptoAnidado');

  // Y aunque no haya ningún número a la vista, los ids reales son evidencia.
  document.getElementById('portal').innerHTML =
    '<div><input type="text" id="concepto1270" value="0.00"><input type="text" id="concepto1280"></div>';
  anidado = sriMapaCasilleros();
  push('sin número al lado, igual devuelve los ids',
       anidado.map(f=>f.id), ['concepto1270','concepto1280']);
  push('y no les inventa un casillero',
       anidado.every(f=>f.casillero==='???'), true);

  // Lo que hace útil un «no encontré nada»: decir qué sí había.
  document.getElementById('portal').innerHTML =
    '<div><input type="text" id="raro-1"><input type="text" id="raro-2"></div>';
  push('sin casilleros, igual cuenta lo que vio', sriMapaCasilleros().length, 0);
  const diag = window.__mapaCasilleros.diagnostico;
  push('dice cuántos inputs de texto había',   diag.inputsDeTexto, 2);
  push('y que ninguno tenía id de casillero',  diag.conIdConcepto, 0);
  push('y nombra los primeros, para reconocerlos',
       diag.primerosIds.includes('raro-1'), true);

  // Volver al formulario simple para lo que sigue.
  document.getElementById('portal').innerHTML = `<table><tbody>
    ${CAS('500','Adquisiciones y pagos (excluye activos fijos) gravados tarifa diferente de cero','concepto1270')}
    ${CAS('510','Adquisiciones netas tarifa diferente de cero','concepto1280')}
    ${CAS('507','Adquisiciones y pagos gravados tarifa 0%','concepto1720')}
    ${CAS('520','Impuesto generado en adquisiciones','concepto1290','readonly')}
  </tbody></table>`;
  mapa = sriMapaCasilleros();

  // El filtro por rango sirve para mirar solo compras, por ejemplo.
  push('se puede pedir un rango',
       sriMapaCasilleros({desde:507, hasta:510}).map(f=>f.casillero), ['507','510']);

  // Lo que se está buscando de verdad.
  push('avisa que acá no está el 5% ni el 502',
       mapa.some(f=>['502','512','540','550'].includes(f.casillero)), false);

  // Y si estuviera, lo encuentra.
  document.getElementById('portal').insertAdjacentHTML('beforeend',
    `<table><tbody>${CAS('540','Adquisiciones locales gravadas con tarifa 5%','concepto9999')}</tbody></table>`);
  mapa = sriMapaCasilleros();
  push('con el 540 en pantalla, lo lista',
       (mapa.find(f=>f.casillero==='540')||{}).id, 'concepto9999');

  // La tabla en Markdown queda lista para pegar en la Biblia.
  push('deja la tabla lista para copiar',
       /\| \*\*540\*\* \| `concepto9999` \| editable \|/.test(window.__mapaCasilleros.markdown), true);

  // Los botones del propio HUD no son casilleros del SRI.
  document.getElementById('portal').insertAdjacentHTML('beforeend',
    `<div data-sc-ui="hud"><table><tbody>${CAS('601','Un input nuestro','sc-falso')}</tbody></table></div>`);
  push('no confunde la UI de la extensión con el formulario',
       sriMapaCasilleros().some(f=>f.id==='sc-falso'), false);

  document.getElementById('portal').innerHTML = '';
  push('sin formulario devuelve lista vacía', sriMapaCasilleros().length, 0);

  // ══ J2 · la botonera ordenada ═══════════════════════════════════════════
  sec('J2 · el cajón de herramientas');
  SriLoopHUD._enSri = () => true; SriLoopHUD._el = null;
  await SriLoopHUD.montar();
  const hud2 = document.getElementById('sri-loop-hud');
  const barra = [...hud2.children].filter(c => c.tagName === 'BUTTON').map(b => b.id);

  // Lo que se ve sin abrir nada: los controles del lote y nada más.
  push('en la barra quedan los del lote',
       barra, ['slh-play','slh-paso','slh-aqui','slh-omitidos','slh-omitir',
               'slh-cerrar','slh-cajon-btn','slh-stop']);
  push('el 🛑 sigue a la vista, que es el que importa',
       barra.includes('slh-stop'), true);

  const cajon = document.getElementById('slh-cajon');
  push('el cajón nace cerrado', cajon.style.display, 'none');
  // Se nombran, en vez de contarlas: agregar una herramienta no tiene por qué
  // romper la prueba, pero perder una sí.
  const enCajon = [...cajon.querySelectorAll('[data-celda]')].map(c => c.getAttribute('data-celda'));
  push('adentro están todas las herramientas',
       ['slh-pdfs','slh-registro','slh-cola','slh-bitacora','slh-proveedores',
        'slh-notas','slh-casilleros','slh-ir','slh-chequeo','slh-subida','slh-panel']
         .filter(id => !enCajon.includes(id)), []);
  // Un ícono suelto no dice nada: cada uno lleva su rótulo escrito.
  push('cada una con su rótulo',
       [...cajon.querySelectorAll('[data-celda]')].every(c => c.textContent.trim().length > 3), true);
  push('los botones se movieron, no se duplicaron',
       document.querySelectorAll('#slh-proveedores').length, 1);

  document.getElementById('slh-cajon-btn').click();
  push('el botón lo abre', cajon.style.display, 'flex');
  push('y lo dice para quien no ve',
       document.getElementById('slh-cajon-btn').getAttribute('aria-expanded'), 'true');
  document.getElementById('slh-cajon-btn').click();
  push('y lo vuelve a cerrar', cajon.style.display, 'none');

  // Los handlers siguen enganchados después de la mudanza.
  document.getElementById('slh-cajon-btn').click();
  document.getElementById('slh-proveedores').click();
  await new Promise(r => setTimeout(r, 150));
  push('y los botones mudados siguen funcionando',
       document.getElementById('slh-proveedores-panel').style.display, 'block');
  // Sin soltar la referencia, el montar() de la seccion siguiente sale por la
  // guarda de arriba y se queda sin barra.
  hud2.remove(); SriLoopHUD._el = null;

  // ══ J · el HUD: que los botones estén y se vean ═════════════════════════
  sec('J · los botones de la barra flotante');

  // El HUD solo se monta dentro del portal; acá se le dice que sí.
  SriLoopHUD._enSri = () => true;
  await SriLoopHUD.montar();
  const hud = document.getElementById('sri-loop-hud');
  push('la barra se monta', !!hud, true);

  const visible = (id) => {
    const b = document.getElementById(id);
    if (!b) return 'NO EXISTE';
    return getComputedStyle(b).display !== 'none' ? 'visible' : 'oculto';
  };

  // Éste es el bug que pasó en pantalla: el botón existía y no se veía.
  push('📐 casilleros está y se ve', visible('slh-casilleros'), 'visible');
  push('🧭 ir a… está y se ve',      visible('slh-ir'),         'visible');

  // Fuera del formulario también: esconderlo fue justo lo que falló.
  push('la URL de la prueba no es el formulario',
       typeof estaEnFormularioIva === 'function' && estaEnFormularioIva(), false);
  await SriLoopHUD.pintar();
  push('y aun así el 📐 sigue a la vista', visible('slh-casilleros'), 'visible');

  // La brújula: los destinos son los puentes SSO de la Matriz Tatuada.
  await SriLoopHUD.pintarIr();
  const irs = [...document.querySelectorAll('#slh-ir-panel [data-sc-ir]')]
                .map(b => b.getAttribute('data-sc-ir'));
  push('ofrece cuatro destinos', irs.length, 4);
  push('todos dentro del portal del SRI',
       irs.every(u => u.startsWith('https://srienlinea.sri.gob.ec/')), true);
  push('recibidos va por el puente SSO, no por la URL directa',
       irs[0].includes('accederAplicacion.jspa'), true);
  push('y el formulario también', irs[1].includes('accederAplicacion.jspa'), true);

  // El panel de casilleros, sobre un formulario de mentira.
  document.getElementById('portal').innerHTML = `<table><tbody>
    ${CAS('500','Adquisiciones gravadas tarifa diferente de cero','concepto1270')}
  </tbody></table>`;
  SriLoopHUD.pintarCasilleros();
  const pc = document.getElementById('slh-casilleros-panel');
  push('el panel lista el casillero',   /concepto1270/.test(pc.innerHTML), true);
  push('y avisa que no hay nada del 5%', /Ni rastro/.test(pc.innerHTML), true);

  // Sin formulario, el panel dice qué hacer en vez de quedar vacío.
  document.getElementById('portal').innerHTML = '';
  SriLoopHUD.pintarCasilleros();
  push('sin casilleros, explica dónde hay que estar',
       /dentro del formulario/.test(pc.innerHTML), true);

  hud.remove();

  // ══ Y · una mezclada de un proveedor del 5% no se reparte a ojo ═════════
  sec('Y · cuando el reparto cabe de DOS maneras');
  // El 5% abrió un agujero nuevo. `repartirMezclada` supone «tarifa plena +
  // 0%», que es cierto en un supermercado. Pero si el emisor factura al 5%
  // —construcción—, la misma factura admite dos cuentas muy distintas:
  //
  //   base $61, IVA $1,83  ->  15% + 0%  =  $12,20 gravado
  //                        ->   5% + 0%  =  $36,60 gravado
  //
  // El crédito tributario sale de esa base: elegir mal declara tres veces más
  // o tres veces menos. El número no distingue los dos casos; quien emitió, sí.
  const OBRERO = '0790000000001', MERCADO = '0791111111001';
  const mez = (ruc) => ({ numero: 1, rucRazon: ruc + ' PROVEEDOR', rucEmisor: ruc,
    valorSinImpuestos: 61, iva: 1.83, importeTotal: 62.83, tieneIva: true });

  // Sin saber nada del emisor se reparte, como siempre: es el caso Supermaxi y
  // NO puede volver a frenarse, que fue justo el bug del 06-sep-2026.
  let rz = calcularResumen([mez(MERCADO)]);
  push('sin datos del emisor, se reparte',         rz.mezcladas.length, 1);
  push('y no queda ambigua',                       rz.ambiguas.length, 0);
  push('con $12.20 al 15%',                        rz.mezcladas[0].basePlena, 12.2);

  // Pero si a ESE emisor ya se le vio un comprobante al 5%, el reparto cabe de
  // dos maneras, y eso no se resuelve adivinando.
  rz = calcularResumen([mez(OBRERO)], { rucsAl5: new Set([OBRERO]) });
  push('con un emisor que factura al 5%, ambigua', rz.ambiguas.length, 1);
  push('y NO se reparte',                          rz.mezcladas.length, 0);
  push('el motivo nombra las dos cuentas',
       /12\.2 al 15%/.test(rz.ambiguas[0].motivo) && /36\.6 al 5%/.test(rz.ambiguas[0].motivo), true);

  // La lista es por RUC, no un interruptor global: el supermercado de la misma
  // corrida se sigue repartiendo bien.
  rz = calcularResumen([mez(MERCADO), mez(OBRERO)], { rucsAl5: new Set([OBRERO]) });
  push('cada emisor por su cuenta · repartidas',   rz.mezcladas.length, 1);
  push('cada emisor por su cuenta · ambiguas',     rz.ambiguas.length, 1);

  // Y cuando el reparto al 5% NO cabe, no hay ambigüedad aunque el emisor
  // facture al 5%: con IVA del 10% de la base, al 5% haría falta el doble de
  // base que la factura entera.
  rz = calcularResumen([{ numero: 1, rucRazon: OBRERO + ' P', rucEmisor: OBRERO,
    valorSinImpuestos: 100, iva: 10, importeTotal: 110, tieneIva: true }],
    { rucsAl5: new Set([OBRERO]) });
  push('si el 5% no cabe, no hay ambigüedad',      rz.mezcladas.length, 1);

  // ══ Z · encontrar el 540 en la tabla real del SRI ═══════════════════════
  sec('Z · el 540 existe y hay que saber encontrarlo');
  // Captura del usuario del 06-sep-2026: el formulario TIENE la fila
  // «Adquisiciones y pagos locales (excluye activos fijos) gravados con tarifa
  // 5% (con derecho a crédito tributario)» con sus casilleros 540, 550 y 560.
  // El bot igual reportó «no se encontró el casillero 540»: las cuatro XPath
  // exigían que la casilla fuera el <td> inmediatamente siguiente al número, y
  // el SRI anida una tabla dentro de cada celda. La estructura de abajo es esa.
  const P = document.getElementById('portal');
  P.innerHTML = `
    <table><tbody>
      <tr>
        <td>Adquisiciones y pagos (excluye activos fijos) gravados tarifa diferente de cero (con derecho a crédito tributario)</td>
        <td><table><tbody><tr><td>500</td></tr></tbody></table></td>
        <td><table><tbody><tr><td><input type="text" id="concepto1270" value="0.00"></td></tr></tbody></table></td>
        <td><table><tbody><tr><td>510</td></tr></tbody></table></td>
        <td><table><tbody><tr><td><input type="text" id="concepto1280" value="0.00"></td></tr></tbody></table></td>
      </tr>
      <tr>
        <td>Adquisiciones y pagos locales (excluye activos fijos) gravados con tarifa 5% (con derecho a crédito tributario)</td>
        <td><table><tbody><tr><td>540</td></tr></tbody></table></td>
        <td><table><tbody><tr><td><input type="text" id="conceptoDesconocidoA" value="0.00"></td></tr></tbody></table></td>
        <td><table><tbody><tr><td>550</td></tr></tbody></table></td>
        <td><table><tbody><tr><td><input type="text" id="conceptoDesconocidoB" value="0.00"></td></tr></tbody></table></td>
      </tr>
      <tr>
        <td>Otras adquisiciones y pagos gravados tarifa diferente de cero (sin derecho a crédito tributario)</td>
        <td><table><tbody><tr><td>502</td></tr></tbody></table></td>
        <td><table><tbody><tr><td><input type="text" id="conceptoDesconocidoC" value="0.00"></td></tr></tbody></table></td>
      </tr>
    </tbody></table>`;

  const halla = async (n) => { const el = await encontrarInputPorCasillero(n); return el ? el.id : null; };

  // Los que ya están en el fieldMap siguen saliendo por ahí: la red nueva no
  // puede cambiar lo que ya funcionaba.
  push('el 500 sigue saliendo por el fieldMap',   await halla('500'), 'concepto1270');
  push('y el 510 también',                        await halla('510'), 'concepto1280');

  // Y los que NO están en el fieldMap ahora aparecen igual.
  push('el 540 se encuentra sin estar mapeado',   await halla('540'), 'conceptoDesconocidoA');
  push('el 550, que es su nota de crédito',       await halla('550'), 'conceptoDesconocidoB');
  push('el 502, el de sin derecho a crédito',     await halla('502'), 'conceptoDesconocidoC');

  // Cada uno con SU casilla: dos filas seguidas de la misma tabla no se mezclan.
  push('el 540 no se lleva la casilla del 500',
       (await halla('540')) !== (await halla('500')), true);

  // Un casillero que de verdad no está sigue devolviendo null. Si esta red
  // atrapara cualquier cosa, la plata iría a un casillero equivocado — que es
  // peor que no declararla, porque nadie se entera.
  push('un casillero ausente sigue siendo null',  await halla('508'), null);

  // ── El 550 se rescata por vecindad ──────────────────────────────────────
  // Corrida real del 07-sep-2026: el 540 apareció (concepto1271) y se llenó;
  // el 550, que está en la MISMA fila, no. El bruto quedó cargado y el neto
  // vacío, que es PEOR que no haber cargado nada — el crédito tributario sale
  // del neto.
  const i540 = await encontrarInputPorCasillero('540');
  push('el 540 sale por el fieldMap ahora',  i540 && i540.id, 'conceptoDesconocidoA');
  // El vecino de fila es el 550, sin suponer nada sobre su id.
  const v550 = vecinoDeFila(i540);
  push('y su vecino de fila es el del 550',  v550 && v550.id, 'conceptoDesconocidoB');
  // No se lleva el de la fila de arriba ni el de la de abajo.
  push('no agarra el del 500',               !!(v550 && v550.id === 'concepto1270'), false);
  push('ni el del 502',                      !!(v550 && v550.id === 'conceptoDesconocidoC'), false);
  // Y el último de la fila no tiene vecino a su derecha: no se inventa uno.
  push('el último de la fila no tiene vecino', vecinoDeFila(v550), null);

  // ── El espacio duro ya no esconde un casillero ──────────────────────────
  // `normalize-space()` de XPath no toca el &nbsp;, que el SRI mete a
  // discreción: «550&nbsp;» no coincidía con '550' y el casillero se volvía
  // invisible para el buscador sin que nada avisara.
  P.innerHTML = P.innerHTML.replace('<td>550</td>', '<td>550\u00a0</td>');
  const conDuro = await encontrarInputPorCasillero('550');
  push('un rótulo con espacio duro igual se encuentra',
       conDuro && conDuro.id, 'conceptoDesconocidoB');

  P.innerHTML = '';

  // ══ Ñ · lo que el formulario reclama, dicho con sus palabras ══════════
  sec('Ñ · el casillero 203: el decreto del 5%');
  // Corrida real del 07-sep-2026. Dos contribuyentes con compras al 5%
  // llenaron el 540 y el 550 bien, y el portal NO los dejó pasar al resumen:
  //
  //   «casillero 203. seleccione el decreto que determina la tarifa reducida
  //    a aplicar.»
  //
  // El cierre mágico, al no encontrar el resumen, los anotó a los dos como
  // `saldo_a_pagar` — con saldo $0.00. Un motivo equivocado manda al contador
  // a buscar plata que no existe, y el campo que falta sigue faltando.
  const pintarMensajes = (html) => {
    P.innerHTML = '<div id="frmFlujoDeclaracion:panelMensajes" ' +
                  'style="display:block;width:400px;height:80px">' + html + '</div>';
  };

  pintarMensajes(
    '<ul><li class="estiloItemsMensajes">Casillero 203. Seleccione el decreto que determina la tarifa reducida a aplicar.</li>' +
    '<li class="estiloItemsMensajes">Casillero 203. El decreto seleccionado es incorrecto.</li></ul>');
  const pide = loQuePideElFormulario();
  push('se leen los dos reclamos',           pide.textos.length, 2);
  push('y se nombra el casillero, una vez',  pide.casilleros, ['203']);
  push('el resumen dice qué mirar',          /casillero 203/.test(pide.resumen), true);

  // Los del 625 son informativos y el flujo ya los saltea: si contaran acá,
  // cada declaración sana quedaría anotada como formulario incompleto.
  pintarMensajes(
    '<ul><li class="estiloItemsMensajes">El casillero 625 se registra sin perjuicio de la facultad determinadora.</li></ul>');
  push('un aviso del 625 no frena nada',     loQuePideElFormulario().textos.length, 0);

  // Mezclados: el informativo se descarta y el que frena queda.
  pintarMensajes(
    '<ul><li class="estiloItemsMensajes">El casillero 625 se registra sin perjuicio de la facultad determinadora.</li>' +
    '<li class="estiloItemsMensajes">Casillero 203. Seleccione el decreto que determina la tarifa reducida a aplicar.</li></ul>');
  const mezcla203 = loQuePideElFormulario();
  push('mezclados: sobrevive sólo el que frena', mezcla203.textos.length, 1);
  push('y sigue nombrando el 203',           mezcla203.casilleros, ['203']);

  // Panel vacío, y panel que no existe: ninguno inventa un reclamo.
  pintarMensajes('<ul></ul>');
  push('un panel vacío no reclama nada',     loQuePideElFormulario().textos.length, 0);
  P.innerHTML = '';
  push('sin panel tampoco',                  loQuePideElFormulario().textos.length, 0);

  // Un panel escondido no cuenta: el SRI lo deja en el DOM entre pasos.
  P.innerHTML = '<div id="frmFlujoDeclaracion:panelMensajes" style="display:none">' +
                '<ul><li class="estiloItemsMensajes">Casillero 203. Seleccione el decreto.</li></ul></div>';
  push('un panel oculto no frena',           loQuePideElFormulario().textos.length, 0);

  // Varios casilleros distintos se listan todos, sin repetir.
  pintarMensajes(
    '<ul><li class="estiloItemsMensajes">Casillero 203. Seleccione el decreto.</li>' +
    '<li class="estiloItemsMensajes">Casillero 203. El decreto es incorrecto.</li>' +
    '<li class="estiloItemsMensajes">Casillero 111. Valor no permitido.</li></ul>');
  push('dos casilleros distintos, sin repetidos',
       loQuePideElFormulario().casilleros, ['203', '111']);

  P.innerHTML = '';

  // ══ O · el 550 y el 518 ya no dependen de la vecindad ════════════════
  sec('O · el 550 y el 518, cableados con evidencia');
  // La vecindad los rescataba, pero depende de que la sección esté abierta
  // — y con la sección cerrada se rindió en silencio: REYES MARQUEZ quedó sin
  // declarar con $4507.72 al 5%. El `id` no depende de nada.
  P.innerHTML = '<input id="concepto1281"><input id="concepto1740">';
  const i550 = await encontrarInputPorCasillero('550');
  push('el 550 sale directo por el fieldMap', i550 && i550.id, 'concepto1281');
  const i518 = await encontrarInputPorCasillero('518');
  push('y el 518 también',                    i518 && i518.id, 'concepto1740');
  P.innerHTML = '';

  // ══ P · el 500 no veía los desplegables ══════════════════════════
  sec('P · el 📐 tiene que ver los desplegables');
  // `sriMapaCasilleros` sólo miraba `input[type=text]` e `input[type=hidden]`.
  // El casillero 203 —el decreto que habilita la tarifa reducida del 5%— es
  // un `<select>`: la herramienta con la que había que buscarlo no lo podía
  // encontrar, y decía «no hay nada» donde sí había.
  P.innerHTML =
    '<table><tr>' +
    '  <td>203</td>' +
    '  <td>Decreto que determina la tarifa reducida a aplicar</td>' +
    '  <td><select id="frmFlujoDeclaracion:somDecreto">' +
    '        <option value="">Seleccione...</option>' +
    '        <option value="D1" selected>Decreto Ejecutivo 1 de 2024</option>' +
    '        <option value="D2">Decreto Ejecutivo 2 de 2025</option>' +
    '      </select></td>' +
    '</tr></table>';
  sriMapaCasilleros();
  const desp = (window.__mapaCasilleros && window.__mapaCasilleros.desplegables) || [];
  push('el desplegable aparece',              desp.length, 1);
  push('con su número de casillero',          desp[0] && desp[0].casillero, '203');
  push('y con su id real',                    desp[0] && desp[0].id, 'frmFlujoDeclaracion:somDecreto');
  push('con las tres opciones',               desp[0] && desp[0].opciones.length, 3);
  push('y dice cuál está elegida',
       desp[0] && desp[0].elegida, 'Decreto Ejecutivo 1 de 2024');
  // El markdown es lo que se pega en la Biblia: si no lleva las opciones, la
  // pasada no sirve para nada — los decretos SON el dato que hay que traer.
  const md1 = (window.__mapaCasilleros && window.__mapaCasilleros.markdown) || '';
  push('el markdown lleva el id del 203',     /somDecreto/.test(md1), true);
  push('y también los decretos',              /Decreto Ejecutivo 2 de 2025/.test(md1), true);

  // PrimeFaces esconde el `<select>` real y pinta un widget con `<li>`. Así
  // es como el portal renderiza sus desplegables de verdad.
  P.innerHTML =
    '<table><tr><td>203</td><td>Tarifa reducida</td><td>' +
    '  <div class="ui-selectonemenu">' +
    '    <select id="frmFlujoDeclaracion:somPF_input"></select>' +
    '    <ul id="frmFlujoDeclaracion:somPF_items">' +
    '      <li data-label="A" class="ui-state-highlight">Decreto A</li>' +
    '      <li data-label="B">Decreto B</li>' +
    '    </ul>' +
    '  </div>' +
    '</td></tr></table>';
  sriMapaCasilleros();
  const pf = (window.__mapaCasilleros && window.__mapaCasilleros.desplegables) || [];
  push('un desplegable de PrimeFaces también se lee', pf.length, 1);
  push('sus opciones salen del panel de items', pf[0] && pf[0].opciones.length, 2);
  push('y la resaltada es la elegida',        pf[0] && pf[0].elegida, 'Decreto A');

  // Sin desplegables no se inventa ninguno.
  P.innerHTML = '<input id="concepto1270" type="text">';
  sriMapaCasilleros();
  push('sin desplegables, la lista va vacía',
       ((window.__mapaCasilleros || {}).desplegables || []).length, 0);

  P.innerHTML = '';



  // ══════════════════════════════════════════════════════════════════════
  const fallos = ok.filter(x=>!x).length;
  document.getElementById('out').textContent =
    L.join('\n') + '\n\n' + (fallos ? '✗ '+fallos+' de '+ok.length+' fallaron'
                                    : '✓ '+ok.length+' comprobaciones, todas bien') +
    (window.__errors.length ? '\n\nERRORES SUELTOS:\n'+window.__errors.join('\n') : '');
})();
</script>
