<!doctype html><meta charset="utf-8"><title>¿Está todo listo para correr el lote?</title>
<body style="font:12px ui-monospace,monospace;padding:18px;background:#0b1622;color:#d5e4fa">
<h3>Un diagnóstico que no dice qué hacer no sirve de nada</h3>
<pre id="out">…</pre>
<div id="portal"></div>
<script>
  const store={};
  window.__errors=[]; window.__logs=[];
  const cap=(f)=>(...a)=>{window.__logs.push(a.map(String).join(' '));f(...a);};
  console.log=cap(console.log); console.warn=cap(console.warn); console.error=cap(console.error);
  window.onerror=(m,s,l,c,e)=>window.__errors.push(String(e&&e.stack||m));
  window.addEventListener('unhandledrejection',e=>window.__errors.push('RECHAZO: '+(e.reason&&e.reason.message||e.reason)));
  // El diagnóstico de subida se le pide al service worker; acá se decide qué
  // contesta, para poder probar los dos finales.
  window.__subida = { ok: true, via: 'worker', intentos: [] };
  window.chrome={runtime:{getURL:p=>'../'+p,getManifest:()=>({version:'3.1.0'}),
    onMessage:{addListener(){}},
    sendMessage:(m)=>Promise.resolve(m && m.tipo==='SC_DIAGNOSTICO_SUBIDA' ? window.__subida : {}),id:'s'},
   storage:{local:{get:k=>Promise.resolve(k===null?{...store}:(Array.isArray(k)?Object.fromEntries(k.filter(x=>x in store).map(x=>[x,store[x]])):(typeof k==='string'?(k in store?{[k]:store[k]}:{}):{}))),set:(o,cb)=>{Object.assign(store,o);cb&&cb();return Promise.resolve()},remove:k=>{[].concat(k).forEach(x=>delete store[x]);return Promise.resolve()}},onChanged:{addListener(){}}},tabs:{create(){}}};
</script>
<script>
  // La clave «del código»: se simula para poder probar los tres finales sin
  // depender de lo que hoy tenga shared_config.js.
  window.SC_CONFIG = { R2_SECRET_ACCESS_KEY: 'la-que-esta-en-el-repositorio' };
</script>
<script src="../build/content.js"></script>
<script>
(async()=>{
  const L=[],ok=[];
  const push=(k,v,e)=>{const b=JSON.stringify(v)===JSON.stringify(e);ok.push(b);
    L.push((b?'  ':'✗ ')+String(k).padEnd(58)+JSON.stringify(v)+(b?'':'  ESPERADO: '+JSON.stringify(e)));};
  const sec=(t)=>L.push('\n── '+t+' '+'─'.repeat(Math.max(0,70-t.length)));
  const de = (filas, clave) => filas.find(f => f.clave === clave) || {};

  // ══ A · lo que mira ═════════════════════════════════════════════════════
  sec('A · qué se revisa');
  let f = await Chequeo.correr({ incluirSubida: false });
  const claves = f.map(x => x.clave);
  push('mira el lote, las marcas y las claves',
       ['cola','sinUbicar','omitidos','clavesR2','claveIa','catastro'].every(c => claves.includes(c)), true);
  push('y dice la versión de la extensión', de(f,'version').detalle.includes('3.1.0'), true);
  push('sin pedirla, no prueba la subida',  claves.includes('subida'), false);

  // Cada estado es uno de tres, y ninguno más.
  push('todos los estados son válidos',
       f.every(x => ['ok','aviso','problema'].includes(x.estado)), true);

  // ══ B · la marca que frena el envío ═════════════════════════════════════
  // Es el chequeo que más veces va a salvar una tarde: si queda pegada de
  // ayer, el cierre mágico no manda NADA y no es obvio por qué.
  sec('B · «compras sin casillero», la que más muerde');
  push('sin nada pendiente, está en verde', de(f,'sinUbicar').estado, 'ok');

  await anotarIvaSinUbicar(['no se encontró el casillero 540: $1000.00 sin declarar'], []);
  f = await Chequeo.correr({ incluirSubida: false });
  push('con la marca puesta es un problema', de(f,'sinUbicar').estado, 'problema');
  push('y avisa que NO se va a enviar',      /NO va a enviar/.test(de(f,'sinUbicar').detalle), true);
  push('y dice cómo se limpia',              de(f,'sinUbicar').queHacer.length > 20, true);
  await anotarIvaSinUbicar([], []);

  // ══ C · las claves: no alcanza con que HAYA una ═════════════════════════
  // Importa de dónde sale. La que está en shared_config.js viaja en el
  // repositorio: que la subida funcione con ella no es una buena noticia.
  sec('C · de dónde sale la clave de R2');

  f = await Chequeo.correr({ incluirSubida: false });
  push('usar la del código es un PROBLEMA',  de(f,'clavesR2').estado, 'problema');
  push('y se dice por qué',                  /historial de git/.test(de(f,'clavesR2').queHacer), true);
  push('con el camino para arreglarlo',      /Manage R2 API Tokens/.test(de(f,'clavesR2').queHacer), true);

  const SECRETO = 'clave-de-mentira-NOSALE';
  // Al rotar el token de Cloudflare cambian LOS DOS. Guardar sólo el secreto
  // deja la mitad vieja en el código y la firma falla igual.
  await chrome.storage.local.set({ sc_r2_credenciales: { R2_SECRET_ACCESS_KEY: SECRETO } });
  f = await Chequeo.correr({ incluirSubida: false });
  push('media rotación todavía avisa',       de(f,'clavesR2').estado, 'aviso');
  push('y dice que falta el Access Key ID',  /Access Key ID/.test(de(f,'clavesR2').detalle), true);

  await chrome.storage.local.set({ sc_r2_credenciales: {
    R2_SECRET_ACCESS_KEY: SECRETO, R2_ACCESS_KEY_ID: 'id-nuevo' } });
  f = await Chequeo.correr({ incluirSubida: false });
  push('con las dos guardadas, verde',       de(f,'clavesR2').estado, 'ok');
  push('y dice que salen del almacén',       /almacén/.test(de(f,'clavesR2').detalle), true);

  // Un diagnóstico no es lugar para que se escape una clave.
  push('y NUNCA muestra la clave',           JSON.stringify(f).includes(SECRETO), false);

  // La de IA es opcional y se dice así, no como si faltara algo roto.
  push('sin clave de IA sólo avisa',         de(f,'claveIa').estado, 'aviso');
  push('y aclara que es opcional',           /opcional/.test(de(f,'claveIa').queHacer), true);

  await chrome.storage.local.remove('sc_r2_credenciales');

  // ══ D · la subida, que es el objetivo §0 ════════════════════════════════
  sec('D · la subida');
  window.__subida = { ok: true, via: 'worker', intentos: [] };
  f = await Chequeo.correr();
  push('cuando anda, lo dice',          de(f,'subida').estado, 'ok');
  push('y por qué camino',              /worker/.test(de(f,'subida').detalle), true);

  window.__subida = { ok: false, intentos: [
    { via: 'worker', error: 'no llegué a x.workers.dev: el permiso está…' },
    { via: 's3', omitido: 'faltan credenciales de R2' } ] };
  f = await Chequeo.correr();
  push('cuando no anda, es un problema', de(f,'subida').estado, 'problema');
  push('y dice por qué falló cada camino',
       /workers.dev/.test(de(f,'subida').detalle) && /credenciales/.test(de(f,'subida').detalle), true);
  // Lo que de verdad está en juego, dicho sin vueltas.
  push('y qué significa que no ande',
       /no queda guardado/.test(de(f,'subida').queHacer), true);

  // ══ E · el resumen de una línea ═════════════════════════════════════════
  sec('E · el resumen');
  push('un problema manda sobre los avisos', Chequeo.resumir(f).estado, 'problema');
  push('sin problemas, avisa',
       Chequeo.resumir([{estado:'ok'},{estado:'aviso'}]).estado, 'aviso');
  push('y todo en verde lo dice',
       Chequeo.resumir([{estado:'ok'},{estado:'ok'}]).texto, 'todo en orden');

  // ══ F · el panel ════════════════════════════════════════════════════════
  sec('F · el panel 🩺');
  SriLoopHUD._enSri = () => true; SriLoopHUD._el = null;
  await SriLoopHUD.montar();
  push('el botón está en el cajón',
       !!document.querySelector('#slh-cajon [data-celda="slh-chequeo"]'), true);
  push('con su rótulo',
       document.querySelector('[data-celda="slh-chequeo"]').textContent.includes('Chequeo'), true);

  await SriLoopHUD.pintarChequeo();
  const panel = document.getElementById('slh-chequeo-panel');
  push('el panel lista los chequeos',   /Subida de comprobantes/.test(panel.innerHTML), true);
  push('y ofrece repetirlo',            !!panel.querySelector('#slh-chequeo-otra'), true);
  // Nadie lee veinte líneas buscando la roja: lo que muerde va arriba.
  // charAt(0) parte el emoji al medio: son dos unidades, no una.
  const orden = [...panel.querySelectorAll('div[style*="border-bottom"]')]
    .map(d => d.textContent.trim());
  push('lo que muerde primero va arriba', orden[0].startsWith('🛑'), true);
  push('y lo que anda queda al final',    orden[orden.length - 1].startsWith('✅'), true);

  // ══ Z · la llave de la web, probada contra la red ═══════════════════════
  sec('Z · el 401 se caza ANTES del lote');
  // El 06-sep-2026 la llave anon estaba revocada del lado de Supabase —no
  // vencida— y TODA la corrida perdió las métricas del panel. Nadie se enteró
  // hasta leer el log, catorce contribuyentes después. Que una llave esté
  // puesta no quiere decir que sirva: hay que preguntarle a Supabase.
  const fetchDeVerdad = window.fetch;
  const LLAVE_WEB = 'ey-ESTA-LLAVE-NO-DEBE-SALIR-EN-EL-INFORME';
  SC_SUPABASE_URL = 'https://ejemplo.supabase.co';
  SC_SUPABASE_ANON_KEY = LLAVE_WEB;
  SC_SUPABASE_ORIGEN = 'de Ajustes';

  const soloWeb = (lista) => lista.find((x) => x.clave === 'web') || {};

  window.fetch = async () => ({ ok: true, status: 200 });
  let w = soloWeb(await Chequeo.correr({ incluirSubida: true }));
  push('con la llave buena, en verde',        w.estado, 'ok');
  push('y dice de dónde salió',               /de Ajustes/.test(w.detalle || ''), true);

  window.fetch = async () => ({ ok: false, status: 401 });
  w = soloWeb(await Chequeo.correr({ incluirSubida: true }));
  push('un 401 es un problema, no un aviso',  w.estado, 'problema');
  push('y dice exactamente qué hacer',
       /Ajustes/.test(w.queHacer || '') && /Supabase/.test(w.queHacer || ''), true);
  // Lo que se pierde tiene que estar dicho: el bot igual declara y guarda el
  // comprobante, y por eso el fallo pasa desapercibido.
  push('nombra lo que se pierde',
       /panel web no se entera/.test(w.queHacer || ''), true);

  // Y JAMÁS el valor de la llave. Es la misma regla que en el diagnóstico de
  // subida y en la página de Ajustes.
  push('el informe no filtra la llave',
       JSON.stringify(await Chequeo.correr({ incluirSubida: true })).includes(LLAVE_WEB), false);

  // Un 500 de Supabase no es lo mismo que una llave mala: puede ser pasajero.
  window.fetch = async () => ({ ok: false, status: 503 });
  w = soloWeb(await Chequeo.correr({ incluirSubida: true }));
  push('un 503 es aviso, no problema',        w.estado, 'aviso');

  // No llegar tampoco condena la llave.
  window.fetch = async () => { throw new TypeError('Failed to fetch'); };
  w = soloWeb(await Chequeo.correr({ incluirSubida: true }));
  push('no llegar es aviso',                  w.estado, 'aviso');
  push('y aclara que la declaración igual se hace',
       /declaraci[oó]n igual se hace/.test(w.queHacer || ''), true);

  // Sin llave configurada, se dice; no se calla.
  SC_SUPABASE_ANON_KEY = null;
  w = soloWeb(await Chequeo.correr({ incluirSubida: true }));
  push('sin llave, lo dice',                  w.estado, 'problema');

  window.fetch = fetchDeVerdad;

  document.getElementById('sri-loop-hud').remove();

  const fallos = ok.filter(x=>!x).length;
  document.getElementById('out').textContent =
    L.join('\n') + '\n\n' + (fallos ? '✗ '+fallos+' de '+ok.length+' fallaron'
                                    : '✓ '+ok.length+' comprobaciones, todas bien') +
    (window.__errors.length ? '\n\nERRORES SUELTOS:\n'+window.__errors.join('\n') : '');
})();
</script>
